[workspace]
members = [
  "crates/cssforge-core",
  "crates/cssforge-tui",
  "crates/cssforge-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["CSSForge Contributors"]

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
crossterm = "0.29.0"
ignore = "0.4"
lightningcss = "1.0.0-alpha.72"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
similar = "3.1.2"
thiserror = "2"
